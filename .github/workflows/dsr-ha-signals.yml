name: DSR Heikin Ashi signals

on:
  workflow_dispatch:
  schedule:
    # Intraday snapshots during the US regular session (UTC; covers DST transition).
    - cron: "0 14-21 * * 1-5"
    # Morning NL final snapshot using the latest completed US trading session.
    - cron: "15 4 * * 1-5"

permissions:
  contents: write

concurrency:
  group: dsr-ha-signals
  cancel-in-progress: false

jobs:
  calculate-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dsr.txt
      - name: Install dependencies
        run: pip install -r requirements-dsr.txt
      - name: Calculate Heikin Ashi, SMA20/50 and volume checks
        run: python scripts/ha_signals.py
      - name: Commit updated signal and source coverage files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ha_signals.csv data/ha_source_coverage.csv
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in DSR-signalen."
          else
            git commit -m "Update DSR Heikin Ashi and volume signals"
            git pull --rebase origin main
            git push
          fi
