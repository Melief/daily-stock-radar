name: VPA Reversal - Watchlist

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vpa-watchlist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run VPA reversal on tickers.txt
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python scripts/vpa_reversal_watchlist.py

      - name: Upload separate watchlist CSV
        uses: actions/upload-artifact@v4
        with:
          name: vpa-reversal-watchlist
          path: vpa_reversal_watchlist.csv
          if-no-files-found: error
          retention-days: 14
