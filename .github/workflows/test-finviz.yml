name: Refresh Finviz tickers and sync to Google Sheets

on:
  workflow_dispatch:
  schedule:
    # Run every two hours during the New York weekday trading day.
    - cron: "50 9,11,13,15,17 * * 1-5"
      timezone: "America/New_York"
  push:
    branches:
      - main
    paths:
      - "scripts/source_status.py"
      - "scripts/test_finviz.py"
      - "scripts/test_blue_sky.py"
      - "blue_sky_url.txt"
      - "scripts/sync_finviz_to_sheets.py"
      - "scripts/is_finviz_refresh_time.py"
      - ".github/workflows/test-finviz.yml"

permissions:
  contents: write

concurrency:
  group: finviz-refresh-and-sheets-sync
  cancel-in-progress: false

jobs:
  refresh-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Finviz tickers and create CSV
        id: finviz
        continue-on-error: true
        run: python scripts/test_finviz.py

      - name: Report Finviz fetch failure without blocking Blue Sky
        if: steps.finviz.outcome == 'failure'
        run: |
          echo "::warning::Finviz refresh failed. Existing Finviz CSV was left unchanged; Blue Sky refresh and Sheets sync continue."

      - name: Fetch Blue Sky tickers and create CSV
        id: blue_sky
        continue-on-error: true
        run: python scripts/test_blue_sky.py

      - name: Record independent source refresh statuses
        if: always()
        run: |
          python scripts/source_status.py fv_momentum_darvas "${{ steps.finviz.outcome }}" --detail "Finviz fetch step"
          python scripts/source_status.py blue_sky "${{ steps.blue_sky.outcome }}" --detail "Blue Sky fetch step"

      - name: Commit updated ticker CSVs to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finviz_tickers.csv data/source_status/*.json
          if [ -f data/blue_sky_tickers.csv ]; then git add data/blue_sky_tickers.csv; fi
          if git diff --cached --quiet; then
            echo "Ticker CSV is unchanged; no commit needed."
          else
            git commit -m "Update Finviz and Blue Sky ticker CSVs"
            # Other workflows may also update main; rebase before pushing.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "ERROR: Could not push ticker CSV after 3 attempts."
                exit 1
              fi
              sleep 3
            done
          fi

      - name: Sync Finviz tickers to Google Sheets
        if: steps.finviz.outcome == 'success'
        env:
          GS_WEBAPP_URL: ${{ vars.GS_WEBAPP_URL }}
          GS_SECRET: ${{ secrets.GS_SECRET }}
          TICKER_CSV_FILE: finviz_tickers.csv
          GS_TARGET_SHEET: Import FV uit GH
        run: python scripts/sync_finviz_to_sheets.py

      - name: Sync Blue Sky tickers to Google Sheets
        if: steps.blue_sky.outcome == 'success'
        env:
          GS_WEBAPP_URL: ${{ vars.GS_WEBAPP_URL }}
          GS_SECRET: ${{ secrets.GS_SECRET }}
          TICKER_CSV_FILE: data/blue_sky_tickers.csv
          GS_TARGET_SHEET: FV > GH > Blue Sky
        run: python scripts/sync_finviz_to_sheets.py

      - name: Report Blue Sky fetch failure after preserving Finviz sync
        if: steps.blue_sky.outcome == 'failure'
        run: |
          echo "::warning::Blue Sky refresh failed. Existing Blue Sky CSV was left unchanged; Finviz refresh and Sheets sync continue."

      - name: Upload ticker CSV artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finviz-tickers-csv
          path: finviz_tickers.csv
          if-no-files-found: warn
          retention-days: 7
