name: Import VYUS Top 25 Holdings

on:
  workflow_dispatch:
  schedule:
    # Run before the 04:15 UTC DSR morning calculation; weekday frequency unchanged.
    - cron: "45 3 * * 1-5"

permissions:
  contents: write

concurrency:
  group: vyus-holdings-refresh
  cancel-in-progress: false

jobs:
  import-vyus:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import VYUS holdings
        id: import
        continue-on-error: true
        env:
          VYUS_GS_WEBAPP_URL: ${{ vars.VYUS_GS_WEBAPP_URL }}
          VYUS_GS_SECRET: ${{ secrets.VYUS_GS_SECRET }}
        run: python scripts/import_vyus_holdings.py

      - name: Commit validated VYUS CSV even if Sheets sync fails
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vyus_tickers.csv
          if [ -f data/source_status/vyus_holdings.json ]; then
            git add data/source_status/vyus_holdings.json
          fi
          if git diff --cached --quiet; then
            echo "VYUS CSV unchanged or no validated refresh was produced."
          else
            git commit -m "Update VYUS holdings ticker CSV"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "ERROR: Could not push VYUS CSV after 3 attempts."
                exit 1
              fi
              sleep 3
            done
          fi

      - name: Mark VYUS import failure
        if: steps.import.outcome == 'failure'
        run: |
          echo "VYUS import failed. A validated CSV refresh, if completed before the failure, was preserved; inspect the stage-specific logs."
          exit 1
