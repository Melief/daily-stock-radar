name: DSR Heikin Ashi signals

on:
  workflow_dispatch:
  schedule:
    # Intraday snapshots during the US regular session (UTC; covers DST transition).
    - cron: "0 14-21 * * 1-5"
    # Morning NL final snapshot using the latest completed US trading session.
    - cron: "15 4 * * 1-5"
  workflow_run:
    # Refresh HA after each source workflow has persisted its result/status.
    # A failed downstream Sheets sync must not block valid source processing.
    workflows:
      - "Refresh Finviz tickers and sync to Google Sheets"
      - "Update TradingView screener tickers"
      - "Import VYUS Top 25 Holdings"
      - "VYUS holdings to CSV"
    types: [completed]
    branches: [main]
  push:
    # Also run once when this workflow definition itself is changed.
    branches: [main]
    paths:
      - ".github/workflows/dsr-ha-signals.yml"
      - "scripts/ha_signals.py"
      - "scripts/market_context.py"
      - "scripts/technical_score.py"
      - "scripts/source_status.py"
      - "data/dsr_ticker_sources.json"
      - "data/source_status/*.json"

permissions:
  contents: write

concurrency:
  group: dsr-ha-signals
  cancel-in-progress: false

jobs:
  calculate-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dsr.txt
      - name: Install dependencies
        run: pip install -r requirements-dsr.txt
      - name: Calculate Heikin Ashi, SMA20/50 and volume checks
        id: calculate
        continue-on-error: true
        run: python scripts/ha_signals.py
      - name: Calculate SPX and QQQ market context
        id: market_context
        if: always() && steps.calculate.outcome != 'skipped'
        continue-on-error: true
        run: python scripts/market_context.py
      - name: Calculate five-part technical scores
        id: technical_score
        if: always() && steps.calculate.outcome != 'skipped' && steps.market_context.outcome == 'success'
        continue-on-error: true
        run: python scripts/technical_score.py
      - name: Commit updated signal, market context and source coverage files
        if: always() && steps.calculate.outcome != 'skipped'
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for output in data/ha_signals.csv data/ha_source_coverage.csv data/dsr_source_status.csv data/dsr_run_status.json data/market_context.json data/technical_scores.csv data/technical_score_status.json; do
            if [ -f "$output" ]; then git add "$output"; fi
          done
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in DSR-signalen."
            exit 0
          fi

          git commit -m "Update DSR Heikin Ashi and volume signals"

          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ -z "$conflicts" ]; then
                echo "ERROR: Rebase failed without a resolvable file conflict."
                git rebase --abort || true
                exit 1
              fi

              # These two files are snapshots generated by this HA run.
              # On an add/add race, keep this run's freshly calculated snapshots.
              while IFS= read -r path; do
                case "$path" in
                  data/dsr_source_status.csv|data/dsr_run_status.json)
                    git checkout --theirs -- "$path"
                    git add "$path"
                    ;;
                  *)
                    echo "ERROR: Unexpected rebase conflict: $path"
                    git rebase --abort || true
                    exit 1
                    ;;
                esac
              done <<< "$conflicts"

              GIT_EDITOR=true git rebase --continue
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Could not push DSR outputs after 3 attempts."
              exit 1
            fi
            sleep 3
          done
      - name: Mark partial DSR pipeline as failed
        if: steps.calculate.outcome == 'failure' || steps.market_context.outcome == 'failure' || steps.technical_score.outcome == 'failure'
        run: |
          echo "HA pipeline is PARTIAL: source freshness, source coverage, ticker analysis, market context or technical scoring is incomplete. See the source status and HA outputs above."
          exit 1
