name: DSR source validation

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ha_signals.py"
      - "data/dsr_ticker_sources.json"
      - "tests/**"
      - "requirements-dsr.txt"
      - ".github/workflows/dsr-source-validation.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ha_signals.py"
      - "data/dsr_ticker_sources.json"
      - "tests/**"
      - "requirements-dsr.txt"
      - ".github/workflows/dsr-source-validation.yml"

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dsr.txt
      - name: Install DSR dependencies
        run: pip install -r requirements-dsr.txt
      - name: Run source validation tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
