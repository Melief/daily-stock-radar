name: Temporary Yahoo download diagnostic

on:
  push:
    branches:
      - diag/yahoo-download-compare-20261120

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DSR data dependencies
        run: pip install -r requirements-dsr.txt
      - name: Compare individual and combined Yahoo downloads
        run: |
          python - <<'PY'
          import csv, time
          import pandas as pd
          import yfinance as yf

          with open("data/ha_signals.csv", newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          unknown = [r["ticker"] for r in rows if not r["status"].startswith("OK")]
          controls = [r["ticker"] for r in rows if r["status"].startswith("OK")][:10]
          tickers = unknown + controls
          print(f"TEST_SET unknown={len(unknown)} controls={len(controls)} total={len(tickers)}")
          print("UNKNOWN_TICKERS=" + ",".join(unknown))
          print("CONTROL_TICKERS=" + ",".join(controls))

          def latest_date(frame):
              if frame is None or frame.empty:
                  return "NO_DATA"
              frame = frame.dropna(subset=["Close"])
              if frame.empty:
                  return "NO_CLOSE"
              idx = pd.Timestamp(frame.index[-1])
              if idx.tzinfo is not None:
                  idx = idx.tz_convert("America/New_York").tz_localize(None)
              return idx.strftime("%Y-%m-%d")

          individual = {}
          for n, ticker in enumerate(tickers, 1):
              try:
                  data = yf.download(ticker, period="10d", interval="1d",
                                     auto_adjust=False, progress=False,
                                     threads=False, timeout=30)
                  if isinstance(data.columns, pd.MultiIndex):
                      data.columns = data.columns.get_level_values(0)
                  individual[ticker] = latest_date(data)
              except Exception as exc:
                  individual[ticker] = "ERROR:" + str(exc)[:180]
              print(f"INDIVIDUAL {n}/{len(tickers)} {ticker} {individual[ticker]}")
              time.sleep(0.35)

          print("START_COMBINED")
          try:
              combined = yf.download(" ".join(tickers), period="10d", interval="1d",
                                     auto_adjust=False, progress=False,
                                     threads=False, group_by="ticker", timeout=60)
              for ticker in tickers:
                  try:
                      if isinstance(combined.columns, pd.MultiIndex):
                          if ticker not in combined.columns.get_level_values(0):
                              individual_combined = "NO_TICKER_COLUMN"
                          else:
                              individual_combined = latest_date(combined[ticker])
                      else:
                          individual_combined = "NO_MULTIINDEX"
                  except Exception as exc:
                      individual_combined = "ERROR:" + str(exc)[:180]
                  print(f"COMBINED {ticker} {individual_combined}")
          except Exception as exc:
              print("COMBINED_REQUEST_ERROR " + repr(exc))
          print("SUMMARY")
          for ticker in tickers:
              print(f"RESULT {ticker} individual={individual[ticker]}")
          PY
