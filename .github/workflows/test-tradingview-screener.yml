name: Update TradingView screener tickers

on:
  workflow_dispatch:
  schedule:
    # 21:45 Amsterdam; twee UTC-momenten met lokale-tijdcheck voor zomer/wintertijd.
    - cron: '45 19 * * 1-5'
    - cron: '45 20 * * 1-5'

permissions:
  contents: write

jobs:
  update-tradingview-tickers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Amsterdam schedule time
        id: schedule
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(TZ=Europe/Amsterdam date +%H)
          MINUTE=$(TZ=Europe/Amsterdam date +%M)
          if [ "$HOUR" = "21" ] && [ "$MINUTE" -ge 40 ] && [ "$MINUTE" -le 59 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC schedule."
          fi

      - name: Install Python dependencies
        if: steps.schedule.outputs.run == 'true'
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Retrieve both TradingView screeners
        if: steps.schedule.outputs.run == 'true'
        run: python scripts/update_tradingview_screeners.py

      - name: Commit updated ticker lists
        if: success() && steps.schedule.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/simpel_monsters_tickers.csv data/follow_thrue_tickers.csv
          if git diff --cached --quiet; then
            echo "Ticker lists unchanged; no commit needed."
          else
            git commit -m "Update both TradingView screener ticker lists"
            git push
          fi
