name: Test Finviz ticker retrieval

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/test_finviz.py"
      - ".github/workflows/test-finviz.yml"

permissions:
  contents: read

jobs:
  test-finviz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Finviz CSV and create ticker list
        run: python scripts/test_finviz.py

      - name: Upload ticker CSV
        uses: actions/upload-artifact@v4
        with:
          name: finviz-tickers-csv
          path: finviz_tickers.csv
          if-no-files-found: error
          retention-days: 7
