name: Test VYUS holdings page

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-vyus:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install test dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Fetch and diagnose StockAnalysis holdings page
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup

          url = "https://stockanalysis.com/quote/etr/VYUS/holdings/"
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9"
          }
          response = requests.get(url, headers=headers, timeout=25)
          print(f"HTTP status: {response.status_code}")
          print(f"Downloaded bytes: {len(response.content)}")
          response.raise_for_status()

          soup = BeautifulSoup(response.text, "html.parser")
          print(f"Page title: {soup.title.get_text(' ', strip=True) if soup.title else '(no title)'}")

          print("\\n--- Links containing quote, stock, or holding ---")
          shown = 0
          for a in soup.find_all("a", href=True):
              href = a["href"]
              label = a.get_text(" ", strip=True)
              if any(word in href.lower() for word in ("quote", "stock", "holding")):
                  print(f"{label[:70]!r} -> {href[:180]}")
                  shown += 1
                  if shown >= 60:
                      break
          print(f"Displayed links: {shown}")

          print("\\n--- Relevant embedded-data markers ---")
          html = response.text
          for term in ("__NEXT_DATA__", "holdings", "AAPL", "MSFT", "symbol", "ticker"):
              positions = [m.start() for m in re.finditer(re.escape(term), html, re.I)]
              print(f"{term}: {len(positions)} occurrence(s)")
              for pos in positions[:2]:
                  print(re.sub(r"\\s+", " ", html[max(0, pos-100):pos+220])[:320])

          print("\\nDIAGNOSTIC RESULT: page retrieval succeeded. No files or Google Sheets were changed.")
          PY
