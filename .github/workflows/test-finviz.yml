name: Test Finviz ticker retrieval

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-finviz:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test retrieval and extraction of Finviz tickers
        run: python scripts/test_finviz.py
