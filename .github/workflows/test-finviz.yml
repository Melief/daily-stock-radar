name: Test Finviz ticker retrieval

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/test_finviz.py"
      - "scripts/vpa_reversal.py"
      - ".github/workflows/test-finviz.yml"

permissions:
  contents: read

jobs:
  test-finviz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Finviz screener HTML
        run: python scripts/test_finviz.py
        continue-on-error: true

      - name: Run VPA reversal check on current Finviz tickers
        run: python scripts/vpa_reversal.py
        continue-on-error: true

      - name: Upload VPA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpa-reversal-results
          path: vpa_reversal.csv
          if-no-files-found: warn
          retention-days: 7

      - name: Upload fetched HTML for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finviz-screener-html
          path: finviz_screener.html
          if-no-files-found: warn
          retention-days: 3
