name: DSR Heikin Ashi signals

on:
  workflow_dispatch:
  schedule:
    # Intraday snapshots during the US regular session (UTC; covers DST transition).
    - cron: "0 14-21 * * 1-5"
    # Daily final snapshot at 04:00 Amsterdam: 02:00 UTC in summer, 03:00 UTC in winter.
    - cron: "0 2 * * 1-5"
    - cron: "0 3 * * 1-5"
  workflow_run:
    workflows:
      - "Manual sync Finviz tickers to Google Sheets"
      - "Update TradingView screener tickers"
      - "VYUS holdings to CSV"
      - "Import VYUS Top 25 Holdings"
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/dsr-ha-signals.yml"
      - "scripts/ha_signals.py"
      - "scripts/market_context.py"
      - "scripts/technical_score.py"
      - "scripts/entry_risk.py"
      - "scripts/long_fundamental_screen.py"
      - "scripts/sw_financial_health.py"
      - "scripts/dsr_schedule_guard.py"
      - "scripts/short_borrow.py"
      - "scripts/candidate_risk_news.py"
      - "scripts/dsr_report.py"
      - "scripts/source_status.py"
      - "data/dsr_ticker_sources.json"
      - "data/sw_financial_health.csv"
      - "data/source_status/*.json"

permissions:
  contents: write

concurrency:
  group: dsr-ha-signals
  cancel-in-progress: false

jobs:
  calculate-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dsr.txt
      - name: Test DSR schedule guard
        run: |
          python -m py_compile scripts/dsr_schedule_guard.py scripts/ha_signals.py scripts/technical_score.py scripts/entry_risk.py scripts/dsr_report.py
          python - <<'PY'
          from scripts.dsr_schedule_guard import should_run

          cases = [
              ("workflow_dispatch", "", "+0100", "", True),
              ("workflow_run", "", "+0100", "success", True),
              ("workflow_run", "", "+0100", "failure", False),
              ("schedule", "0 14-21 * * 1-5", "+0100", "", True),
              ("schedule", "0 14-21 * * 1-5", "+0200", "", True),
              ("schedule", "0 2 * * 1-5", "+0200", "", True),
              ("schedule", "0 2 * * 1-5", "+0100", "", False),
              ("schedule", "0 3 * * 1-5", "+0100", "", True),
              ("schedule", "0 3 * * 1-5", "+0200", "", False),
              ("schedule", "45 1 * * 1-5", "+0200", "", True),
              ("schedule", "45 2 * * 1-5", "+0100", "", True),
          ]
          for event, cron, offset, conclusion, expected in cases:
              actual = should_run(event, cron, offset, conclusion)
              assert actual is expected, (event, cron, offset, conclusion, actual, expected)
          print(f"Schedule guard: {len(cases)} tests passed.")
          PY
      - name: Check Amsterdam schedule time
        id: schedule
        env:
          SCHEDULE: ${{ github.event.schedule }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: python scripts/dsr_schedule_guard.py >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.schedule.outputs.run == 'true'
        run: pip install -r requirements-dsr.txt
      - name: Calculate Heikin Ashi, SMA20/50 and volume checks
        id: calculate
        if: steps.schedule.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/ha_signals.py
      - name: Calculate SPX and QQQ market context
        id: market_context
        if: always() && steps.schedule.outputs.run == 'true' && steps.calculate.outcome != 'skipped'
        continue-on-error: true
        run: python scripts/market_context.py
      - name: Calculate five-part technical scores
        id: technical_score
        if: always() && steps.schedule.outputs.run == 'true' && steps.calculate.outcome != 'skipped' && steps.market_context.outcome == 'success'
        continue-on-error: true
        run: python scripts/technical_score.py
      - name: Check Long fundamental criteria
        id: long_fundamentals
        if: always() && steps.schedule.outputs.run == 'true' && steps.technical_score.outcome == 'success'
        continue-on-error: true
        run: python scripts/long_fundamental_screen.py
      - name: Validate manual Simply Wall St Financial Health checks
        id: sw_financial_health
        if: always() && steps.schedule.outputs.run == 'true' && steps.long_fundamentals.outcome != 'skipped'
        continue-on-error: true
        run: python scripts/sw_financial_health.py
      - name: Check IBKR short-borrow inventory for qualified Short candidates
        id: short_borrow
        if: always() && steps.schedule.outputs.run == 'true' && steps.technical_score.outcome == 'success'
        continue-on-error: true
        run: python scripts/short_borrow.py
      - name: Check candidate news, short interest and gap risk
        id: candidate_risk_news
        if: always() && steps.schedule.outputs.run == 'true' && steps.sw_financial_health.outcome != 'skipped' && steps.short_borrow.outcome != 'skipped'
        continue-on-error: true
        run: python scripts/candidate_risk_news.py
      - name: Calculate HA stop, risk percentage and 2R watchlist levels
        id: entry_risk
        if: always() && steps.schedule.outputs.run == 'true' && steps.technical_score.outcome == 'success'
        continue-on-error: true
        run: python scripts/entry_risk.py
      - name: Build consolidated DSR report
        id: dsr_report
        if: always() && steps.schedule.outputs.run == 'true' && steps.technical_score.outcome == 'success'
        continue-on-error: true
        run: python scripts/dsr_report.py
      - name: Commit updated signal, market context and source coverage files
        id: commit_outputs
        if: always() && steps.schedule.outputs.run == 'true' && steps.calculate.outcome != 'skipped'
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for output in data/ha_signals.csv data/ha_source_coverage.csv data/dsr_source_status.csv data/dsr_run_status.json data/dsr_report_status.json data/dsr_report.md data/market_context.json data/technical_scores.csv data/technical_score_status.json data/short_borrow.csv data/short_borrow_status.json data/long_fundamentals.csv data/long_fundamental_status.json data/long_sw_status.csv data/long_sw_status.json data/candidate_risk_news.csv data/candidate_risk_news_status.json data/entry_risk.csv data/entry_risk_status.json; do
            if [ -f "$output" ]; then git add "$output"; fi
          done
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in DSR-signalen."
            exit 0
          fi

          git commit -m "Update DSR Heikin Ashi and volume signals"

          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ -z "$conflicts" ]; then
                echo "ERROR: Rebase failed without a resolvable file conflict."
                git rebase --abort || true
                exit 1
              fi

              # These are generated DSR output snapshots; keep this run's versions.
              while IFS= read -r path; do
                case "$path" in
                  data/ha_signals.csv|data/ha_source_coverage.csv|data/dsr_source_status.csv|data/dsr_run_status.json|data/market_context.json|data/technical_scores.csv|data/technical_score_status.json|data/short_borrow.csv|data/short_borrow_status.json|data/long_fundamentals.csv|data/long_fundamental_status.json|data/long_sw_status.csv|data/long_sw_status.json|data/candidate_risk_news.csv|data/candidate_risk_news_status.json|data/entry_risk.csv|data/entry_risk_status.json|data/dsr_report.md|data/dsr_report_status.json)
                    git checkout --theirs -- "$path"
                    git add "$path"
                    ;;
                  *)
                    echo "ERROR: Unexpected rebase conflict: $path"
                    git rebase --abort || true
                    exit 1
                    ;;
                esac
              done <<< "$conflicts"

              GIT_EDITOR=true git rebase --continue
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Could not push DSR outputs after 3 attempts."
              exit 1
            fi
            sleep 3
          done
      - name: Classify DSR execution
        if: always()
        env:
          SCHEDULE_RUN: ${{ steps.schedule.outputs.run }}
          SCHEDULE_OUTCOME: ${{ steps.schedule.outcome }}
          CALCULATE_OUTCOME: ${{ steps.calculate.outcome }}
          MARKET_CONTEXT_OUTCOME: ${{ steps.market_context.outcome }}
          TECHNICAL_SCORE_OUTCOME: ${{ steps.technical_score.outcome }}
          ENTRY_RISK_OUTCOME: ${{ steps.entry_risk.outcome }}
          REPORT_OUTCOME: ${{ steps.dsr_report.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit_outputs.outcome }}
          LONG_FUNDAMENTALS_OUTCOME: ${{ steps.long_fundamentals.outcome }}
          SW_HEALTH_OUTCOME: ${{ steps.sw_financial_health.outcome }}
          SHORT_BORROW_OUTCOME: ${{ steps.short_borrow.outcome }}
          CANDIDATE_RISK_OUTCOME: ${{ steps.candidate_risk_news.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$SCHEDULE_OUTCOME" != "success" ]; then
            echo "DSR status: FOUT — schedule guard/test did not complete."
            echo "## DSR status: FOUT" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$SCHEDULE_RUN" != "true" ]; then
            if [ "$EVENT_NAME" = "workflow_run" ] && [ "$UPSTREAM_CONCLUSION" != "success" ]; then
              echo "DSR status: SKIPPED — upstream source workflow concluded $UPSTREAM_CONCLUSION."
              echo "## DSR status: SKIPPED" >> "$GITHUB_STEP_SUMMARY"
              echo "Upstream source workflow was not successful; DSR calculations were not started." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "DSR status: SKIPPED — non-matching seasonal cron."
              echo "## DSR status: SKIPPED" >> "$GITHUB_STEP_SUMMARY"
              echo "The other seasonal 04:00 cron is intentionally ignored." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          required_failures=""
          for item in \
            "HA calculation:$CALCULATE_OUTCOME" \
            "Market context:$MARKET_CONTEXT_OUTCOME" \
            "Technical scores:$TECHNICAL_SCORE_OUTCOME" \
            "Entry risk:$ENTRY_RISK_OUTCOME" \
            "DSR report:$REPORT_OUTCOME" \
            "Commit outputs:$COMMIT_OUTCOME"; do
            name="${item%%:*}"
            outcome="${item#*:}"
            if [ "$outcome" != "success" ]; then
              required_failures="$required_failures
- $name: $outcome"
            fi
          done

          if [ -n "$required_failures" ]; then
            echo "DSR status: FOUT — an essential calculation, report or save step failed."
            printf '%s\n' "$required_failures"
            {
              echo "## DSR status: FOUT"
              printf '%s\n' "$required_failures"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ ! -s data/dsr_report.md ] || [ ! -s data/dsr_report_status.json ]; then
            echo "DSR status: FOUT — the current run did not produce a DSR report and status file."
            echo "## DSR status: FOUT" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          report_status="$(python -c 'import json; print(json.load(open("data/dsr_report_status.json", encoding="utf-8")).get("status", "UNKNOWN"))')"
          optional_failures=""
          for item in \
            "Long fundamentals:$LONG_FUNDAMENTALS_OUTCOME" \
            "Simply Wall St:$SW_HEALTH_OUTCOME" \
            "Short borrow:$SHORT_BORROW_OUTCOME" \
            "News and candidate risk:$CANDIDATE_RISK_OUTCOME"; do
            name="${item%%:*}"
            outcome="${item#*:}"
            if [ "$outcome" = "failure" ]; then
              optional_failures="$optional_failures
- $name: aanvullende controle niet beschikbaar"
            fi
          done

          if [ "$report_status" = "FULL" ] && [ -z "$optional_failures" ]; then
            echo "DSR status: OK — essential calculations, report and save completed."
            echo "## DSR status: OK" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$report_status" = "PARTIAL" ] || [ -n "$optional_failures" ]; then
            echo "DSR status: PARTIAL — report generated; one or more data or enrichment checks remain incomplete."
            printf '%s\n' "$optional_failures"
            {
              echo "## DSR status: PARTIAL"
              echo "The DSR report was generated and saved. Missing or incomplete checks are shown in the report/status files."
              printf '%s\n' "$optional_failures"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "DSR status: FOUT — unexpected report status: $report_status"
            echo "## DSR status: FOUT — unexpected report status: $report_status" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
