name: Update TradingView screener tickers

on:
  workflow_dispatch:
  schedule:
    # 21:45 Amsterdam; twee UTC-momenten met lokale-tijdcheck voor zomer/wintertijd.
    - cron: '45 19 * * 1-5'
    - cron: '45 20 * * 1-5'

permissions:
  contents: write

jobs:
  update-tradingview-tickers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Amsterdam schedule time
        id: schedule
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SCHEDULE="${{ github.event.schedule }}"
          OFFSET=$(TZ=Europe/Amsterdam date +%z)

          # The two cron entries represent 21:45 Amsterdam in summer and winter.
          # Use the event's cron expression instead of a narrow execution-time window,
          # because GitHub Actions may start scheduled workflows hours late.
          if { [ "$SCHEDULE" = "45 19 * * 1-5" ] && [ "$OFFSET" = "+0200" ]; } ||
             { [ "$SCHEDULE" = "45 20 * * 1-5" ] && [ "$OFFSET" = "+0100" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running scheduled TradingView refresh: $SCHEDULE (Amsterdam UTC$OFFSET)."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping non-matching DST schedule: $SCHEDULE (Amsterdam UTC$OFFSET)."
          fi

      - name: Install Python dependencies
        if: steps.schedule.outputs.run == 'true'
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Retrieve both TradingView screeners
        id: retrieve
        if: steps.schedule.outputs.run == 'true'
        run: python scripts/update_tradingview_screeners.py

      - name: Commit successfully retrieved ticker lists
        if: always() && steps.schedule.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/simpel_monsters_tickers.csv data/follow_thrue_tickers.csv data/source_status/*.json
          if git diff --cached --quiet; then
            echo "Ticker lists unchanged; no commit needed."
          else
            git commit -m "Update both TradingView screener ticker lists"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "ERROR: Could not push TradingView source files after 3 attempts."
                exit 1
              fi
              sleep 3
            done
          fi

      - name: Mark incomplete TradingView refresh as failed
        if: steps.retrieve.outcome == 'failure'
        run: |
          echo "TradingView refresh is PARTIAL: at least one screener failed. Any successfully retrieved source CSV was committed; inspect the logs."
          exit 1
