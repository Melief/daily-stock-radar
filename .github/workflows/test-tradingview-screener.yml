name: Test TradingView screener ticker retrieval

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-tradingview-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose TradingView URLs
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p tv-diagnostic
          while IFS='|' read -r LABEL URL; do
            echo "===== $LABEL ====="
            STATUS=$(curl -L -sS --max-time 45 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128.0.0.0 Safari/537.36' \
              -o "tv-diagnostic/$LABEL.html" \
              -w '%{http_code}' "$URL" || true)
            FINAL_URL=$(curl -L -sS --max-time 45 -o /dev/null \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128.0.0.0 Safari/537.36' \
              -w '%{url_effective}' "$URL" || true)
            echo "HTTP status: ${STATUS:-curl-error}"
            echo "Final URL: $FINAL_URL"
            echo "Downloaded bytes: $(wc -c < "tv-diagnostic/$LABEL.html" 2>/dev/null || echo 0)"
            python - "$LABEL" <<'PY'
          import re, sys
          from pathlib import Path
          label = sys.argv[1]
          html = Path(f"tv-diagnostic/{label}.html").read_text(errors="replace")
          title = re.search(r"<title[^>]*>(.*?)</title>", html, re.I | re.S)
          print("Page title:", re.sub(r"\s+", " ", title.group(1)).strip()[:200] if title else "(no title)")
          for term in ("JPfZmDr6", "screenerData", "symbols", "404", "not found", "sign in"):
              print(f"Contains {term!r}:", term.lower() in html.lower())
          matches = sorted(set(re.findall(r'(?<![A-Za-z0-9_])(?:NASDAQ|NYSE|AMEX|ARCA|BATS):[A-Z][A-Z0-9.-]{0,14}', html)))
          print("Exchange-qualified ticker-like strings:", ", ".join(matches[:50]) or "(none)")
          PY
          done <<'EOF'
          saved_screener|https://www.tradingview.com/screener/JPfZmDr6/
          screener_root|https://www.tradingview.com/screener/
          EOF

      - name: Upload diagnostic HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingview-screener-diagnostic
          path: tv-diagnostic/
          if-no-files-found: warn
          retention-days: 7
