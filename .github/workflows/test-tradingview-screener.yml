name: Test TradingView screener ticker retrieval

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-tradingview-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Diagnose TradingView HTML
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p tv-diagnostic
          while IFS='|' read -r LABEL URL; do
            echo "===== $LABEL ====="
            STATUS=$(curl -L -sS --max-time 45 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128.0.0.0 Safari/537.36' \
              -o "tv-diagnostic/$LABEL.html" \
              -w '%{http_code}' "$URL" || true)
            echo "HTTP status: ${STATUS:-curl-error}"
            echo "Downloaded bytes: $(wc -c < "tv-diagnostic/$LABEL.html" 2>/dev/null || echo 0)"
            python - "$LABEL" <<'PY'
          import json, re, sys
          from pathlib import Path
          label = sys.argv[1]
          html = Path(f"tv-diagnostic/{label}.html").read_text(errors="replace")
          title = re.search(r"<title[^>]*>(.*?)</title>", html, re.I | re.S)
          print("Page title:", re.sub(r"\\s+", " ", title.group(1)).strip()[:200] if title else "(no title)")
          m = re.search(r"window\.initData\.screen_data\s*=\s*(\{.*?\})\s*;", html, re.S)
          if m:
              data = json.loads(m.group(1))
              print("Saved screen config found: yes")
              print("Screen title:", data.get("title"))
              print("Filter count:", len(data.get("filters", [])))
              print("Sort column:", (data.get("sort_column") or {}).get("id"))
              print("Shared:", data.get("is_shared"))
          else:
              print("Saved screen config found: no")
              for term in ("screen_data", "filters", "JPfZmDr6"):
                  positions = [x.start() for x in re.finditer(re.escape(term), html, re.I)][:3]
                  print(f"HTML occurrences for {term}:", len(list(re.finditer(re.escape(term), html, re.I))))
                  for pos in positions:
                      print("HTML snippet:", html[max(0, pos-180):pos+500].replace("\\n", " ")[:700])
          PY
          done <<'EOF'
          saved_screener|https://www.tradingview.com/screener/JPfZmDr6/
          EOF

      - name: Install browser for rendered screener test
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Test rendered screener and capture scanner requests
        shell: bash
        run: |
          mkdir -p tv-diagnostic
          cat > tv-diagnostic/render_test.py <<'PY'
          import re, json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          url = "https://www.tradingview.com/screener/JPfZmDr6/"
          responses = []
          requests = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1600, "height": 1000})
              page.on("response", lambda r: responses.append(r))
              page.on("request", lambda q: requests.append(q) if ("scanner" in q.url.lower() or "/scan" in q.url.lower()) else None)
              try:
                  response = page.goto(url, wait_until="domcontentloaded", timeout=90000)
                  print("Browser HTTP status:", response.status if response else "no response")
                  page.wait_for_timeout(15000)
                  print("Rendered page title:", page.title())
                  html = page.content()
                  Path("tv-diagnostic/rendered.html").write_text(html, encoding="utf-8")
                  body = page.locator("body").inner_text(timeout=15000)
                  Path("tv-diagnostic/rendered.txt").write_text(body, encoding="utf-8")
                  print("Rendered body excerpt:")
                  print(body[:6000].replace("\\n", " | "))
                  print("Possible ticker tokens:", ", ".join(sorted(set(re.findall(r"\\b[A-Z]{1,6}(?:[.-][A-Z]{1,3})?\\b", body)))[:100]))
                  relevant = [r for r in responses if "scanner" in r.url.lower() or "/scan" in r.url.lower()]
                  print("Scanner-like responses:", len(relevant))
                  print("Scanner request details:")
                  for q in requests[:20]:
                      print(f"REQUEST: method={q.method} url={q.url[:500]}")
                      if q.post_data:
                          print("POST body:", q.post_data[:5000])
                  for i, r in enumerate(relevant[:20]):
                      print(f"RESPONSE {i+1}: status={r.status} type={r.headers.get('content-type','')} url={r.url[:500]}")
                      try:
                          text = r.text()
                          Path(f"tv-diagnostic/scanner-response-{i+1}.txt").write_text(text, encoding="utf-8")
                          print("Body excerpt:", text[:3000].replace("\\n", " "))
                          try:
                              payload = json.loads(text)
                              rows = payload.get("data", [])
                              symbols = [row.get("s", "") for row in rows if isinstance(row, dict)]
                              if symbols:
                                  print("SCANNER SYMBOLS:", ", ".join(symbols))
                                  Path(f"tv-diagnostic/scanner-symbols-{i+1}.txt").write_text("\\n".join(symbols) + "\\n", encoding="utf-8")
                          except (json.JSONDecodeError, AttributeError, TypeError):
                              pass
                      except Exception as e:
                          print("Could not read response body:", str(e)[:200])
              except Exception as e:
                  print("BROWSER TEST ERROR:", repr(e))
              finally:
                  browser.close()
          PY
          python tv-diagnostic/render_test.py

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingview-screener-diagnostic
          path: tv-diagnostic/
          if-no-files-found: warn
          retention-days: 7
