name: DSR Heikin Ashi signals

on:
  workflow_dispatch:
  schedule:
    # Intraday snapshots on US trading days, plus the final after-close run.
    - cron: "0 16,18,20 * * 1-5"
    - cron: "15 4 * * 1-5"

permissions:
  contents: write

concurrency:
  group: dsr-ha-signals
  cancel-in-progress: false

jobs:
  calculate-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dsr.txt
      - name: Install dependencies
        run: pip install -r requirements-dsr.txt
      - name: Calculate Heikin Ashi and SMA signals
        run: python scripts/ha_signals.py
      - name: Commit updated signal file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ha_signals.csv
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in DSR-signalen."
          else
            git commit -m "Update daily DSR Heikin Ashi signals"
            git push
          fi
