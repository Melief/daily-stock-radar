name: Test Finviz ticker retrieval

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/test_finviz.py"
      - ".github/workflows/test-finviz.yml"

permissions:
  contents: write

jobs:
  test-finviz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Finviz tickers and create CSV
        run: python scripts/test_finviz.py

      - name: Commit updated ticker CSV to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finviz_tickers.csv
          if git diff --cached --quiet; then
            echo "Ticker CSV is unchanged; no commit needed."
          else
            git commit -m "Update Finviz ticker CSV"
            git push
          fi

      - name: Upload ticker CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: finviz-tickers-csv
          path: finviz_tickers.csv
          if-no-files-found: error
          retention-days: 7
