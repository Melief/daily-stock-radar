name: Refresh Finviz tickers and sync to Google Sheets

on:
  workflow_dispatch:
  schedule:
    # Trigger hourly across the New York trading day in both EST and EDT.
    # The timezone gate selects 09:50, 11:50, 13:50, 15:50 and 17:50 local.
    - cron: "50 13-22 * * 1-5"
  push:
    branches:
      - main
    paths:
      - "scripts/test_finviz.py"
      - "scripts/sync_finviz_to_sheets.py"
      - "scripts/is_finviz_refresh_time.py"
      - ".github/workflows/test-finviz.yml"

permissions:
  contents: write

concurrency:
  group: finviz-refresh-and-sheets-sync
  cancel-in-progress: false

jobs:
  refresh-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check New York refresh time
        id: timecheck
        run: python scripts/is_finviz_refresh_time.py

      - name: Fetch Finviz tickers and create CSV
        if: steps.timecheck.outputs.run == 'true' || github.event_name != 'schedule'
        run: python scripts/test_finviz.py

      - name: Commit updated ticker CSV to GitHub
        if: steps.timecheck.outputs.run == 'true' || github.event_name != 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finviz_tickers.csv
          if git diff --cached --quiet; then
            echo "Ticker CSV is unchanged; no commit needed."
          else
            git commit -m "Update Finviz ticker CSV"
            # Other workflows may also update main; rebase before pushing.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "ERROR: Could not push ticker CSV after 3 attempts."
                exit 1
              fi
              sleep 3
            done
          fi

      - name: Sync latest GitHub ticker CSV to Google Sheets
        if: steps.timecheck.outputs.run == 'true' || github.event_name != 'schedule'
        env:
          GS_WEBAPP_URL: ${{ vars.GS_WEBAPP_URL }}
          GS_SECRET: ${{ secrets.GS_SECRET }}
        run: python scripts/sync_finviz_to_sheets.py

      - name: Upload ticker CSV artifact
        if: always() && (steps.timecheck.outputs.run == 'true' || github.event_name != 'schedule')
        uses: actions/upload-artifact@v4
        with:
          name: finviz-tickers-csv
          path: finviz_tickers.csv
          if-no-files-found: warn
          retention-days: 7
