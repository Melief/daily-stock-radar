name: EURO STOXX 50 – constituents and tickers

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * 1"

permissions:
  contents: write

jobs:
  update-eurostoxx50:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Fetch STOXX constituents and resolve tickers
        run: python scripts/update_eurostoxx50.py

      - name: Commit updated CSV if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eurostoxx50_tickers.csv
          if git diff --cached --quiet; then
            echo "EURO STOXX 50 CSV is unchanged; no commit needed."
          else
            git commit -m "Update EURO STOXX 50 constituents and tickers"
            git push
          fi
