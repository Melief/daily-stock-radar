name: Test VYUS holdings page

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-vyus:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install test dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Fetch page and extract stock ticker links
        run: |
          python - <<'PY'
          import re
          import sys
          import requests
          from bs4 import BeautifulSoup

          url = "https://stockanalysis.com/quote/etr/VYUS/holdings/"
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9"
          }

          response = requests.get(url, headers=headers, timeout=25)
          print(f"HTTP status: {response.status_code}")
          print(f"Downloaded bytes: {len(response.content)}")
          response.raise_for_status()

          soup = BeautifulSoup(response.text, "html.parser")
          print(f"Page title: {soup.title.get_text(' ', strip=True) if soup.title else '(no title)'}")

          # Holdings use paths such as /stocks/team/, not /quote/.../.
          tickers = []
          for a in soup.find_all("a", href=True):
              href = a["href"].split("?")[0].split("#")[0]
              match = re.fullmatch(r"/stocks/([a-zA-Z][a-zA-Z0-9.-]*)/?", href)
              if match:
                  ticker = match.group(1).upper()
                  if ticker not in tickers:
                      tickers.append(ticker)

          print(f"Unique stock tickers found: {len(tickers)}")
          print("Tickers:", ", ".join(tickers) if tickers else "(none)")

          if len(tickers) >= 20:
              print("RESULT: ticker extraction works. This is a test only; no files or Google Sheets were changed.")
          else:
              print("RESULT: too few stock links found; inspect page structure.")
              sys.exit(1)
          PY
