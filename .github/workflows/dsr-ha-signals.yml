name: DSR Heikin Ashi signals

on:
  workflow_dispatch:
  schedule:
    # Intraday snapshots during the US regular session (UTC; covers DST transition).
    - cron: "0 14-21 * * 1-5"
    # Morning NL final snapshot using the latest completed US trading session.
    - cron: "15 4 * * 1-5"
  workflow_run:
    # Refresh HA immediately after the Finviz CSV workflow has completed.
    workflows:
      - "Refresh Finviz tickers and sync to Google Sheets"
      - "Update TradingView screener tickers"
    types: [completed]
    branches: [main]
  push:
    # Also run once when this workflow definition itself is changed.
    branches: [main]
    paths:
      - ".github/workflows/dsr-ha-signals.yml"
      - "scripts/ha_signals.py"
      - "scripts/source_status.py"
      - "data/dsr_ticker_sources.json"

permissions:
  contents: write

concurrency:
  group: dsr-ha-signals
  cancel-in-progress: false

jobs:
  calculate-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dsr.txt
      - name: Install dependencies
        run: pip install -r requirements-dsr.txt
      - name: Calculate Heikin Ashi, SMA20/50 and volume checks
        id: calculate
        continue-on-error: true
        run: python scripts/ha_signals.py
      - name: Commit updated signal and source coverage files
        if: always() && steps.calculate.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for output in data/ha_signals.csv data/ha_source_coverage.csv data/dsr_source_status.csv data/dsr_run_status.json; do
            if [ -f "$output" ]; then git add "$output"; fi
          done
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in DSR-signalen."
          else
            git commit -m "Update DSR Heikin Ashi and volume signals"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "ERROR: Could not push DSR outputs after 3 attempts."
                exit 1
              fi
              sleep 3
            done
          fi
      - name: Mark partial HA pipeline as failed
        if: steps.calculate.outcome == 'failure'
        run: |
          echo "HA pipeline is PARTIAL: source freshness, source coverage or ticker analysis is incomplete. See the source status and HA outputs above."
          exit 1
