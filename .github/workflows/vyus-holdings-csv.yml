name: VYUS holdings to CSV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vyus-to-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Fetch holdings and write CSV
        run: |
          python - <<'PY'
          import csv
          import re
          import requests
          from bs4 import BeautifulSoup
          from pathlib import Path

          url = "https://stockanalysis.com/quote/etr/VYUS/holdings/"
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9"
          }

          response = requests.get(url, headers=headers, timeout=25)
          print(f"HTTP status: {response.status_code}")
          response.raise_for_status()

          soup = BeautifulSoup(response.text, "html.parser")
          excluded = {"SCREENER", "COMPARE", "EARNINGS-CALENDAR", "INDUSTRY"}
          tickers = []
          for a in soup.find_all("a", href=True):
              href = a["href"].split("?")[0].split("#")[0]
              match = re.fullmatch(r"/stocks/([a-zA-Z][a-zA-Z0-9.-]*)/?", href)
              if match:
                  ticker = match.group(1).upper()
                  if ticker not in excluded and ticker not in tickers:
                      tickers.append(ticker)

          if not tickers:
              raise SystemExit("No tickers found; CSV not written.")

          output = Path("data/vyus_tickers.csv")
          output.parent.mkdir(parents=True, exist_ok=True)
          with output.open("w", newline="", encoding="utf-8") as f:
              writer = csv.writer(f)
              writer.writerow(["ticker"])
              writer.writerows([[ticker] for ticker in tickers])

          print(f"Wrote {len(tickers)} unique tickers to {output}")
          print(", ".join(tickers))
          PY

      - name: Commit updated CSV if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vyus_tickers.csv
          if git diff --cached --quiet; then
            echo "CSV is unchanged; no commit needed."
          else
            git commit -m "Update VYUS holdings tickers CSV"
            git push
          fi

      - name: Send tickers to Google Sheets
        env:
          VYUS_GS_WEBAPP_URL: ${{ vars.VYUS_GS_WEBAPP_URL }}
          VYUS_GS_SECRET: ${{ secrets.VYUS_GS_SECRET }}
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          import sys
          import requests

          url = os.environ.get("VYUS_GS_WEBAPP_URL", "").strip()
          secret = os.environ.get("VYUS_GS_SECRET", "").strip()
          if not url or not secret:
              sys.exit("Missing GitHub variable VYUS_GS_WEBAPP_URL or secret VYUS_GS_SECRET.")

          with open("data/vyus_tickers.csv", newline="", encoding="utf-8") as f:
              reader = csv.DictReader(f)
              tickers = [row["ticker"].strip().upper() for row in reader if row.get("ticker", "").strip()]

          if not tickers:
              sys.exit("CSV contains no tickers; not sending.")

          response = requests.post(
              url,
              json={"secret": secret, "tickers": tickers},
              timeout=30,
              allow_redirects=True,
          )
          print(f"Google Apps Script HTTP status: {response.status_code}")
          response.raise_for_status()

          try:
              result = response.json()
          except ValueError:
              result = None

          if isinstance(result, dict) and (result.get("success") is False or result.get("ok") is False or result.get("error")):
              sys.exit("Google Apps Script rejected the request: " + json.dumps(result, ensure_ascii=False))

          print(f"Response: {response.text[:1000]}")
          print(f"Sent {len(tickers)} tickers to the Google Sheets web app.")
          PY
