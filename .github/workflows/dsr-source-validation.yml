name: DSR source validation

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ha_signals.py"
      - "scripts/market_context.py"
      - "scripts/technical_score.py"
      - "scripts/selection_rules.py"
      - "scripts/entry_risk.py"
      - "scripts/long_fundamental_screen.py"
      - "scripts/sw_financial_health.py"
      - "scripts/dsr_schedule_guard.py"
      - "scripts/short_borrow.py"
      - "scripts/candidate_risk_news.py"
      - "scripts/dsr_report.py"
      - "scripts/source_status.py"
      - "scripts/import_vyus_holdings.py"
      - "scripts/update_tradingview_screeners.py"
      - ".github/workflows/dsr-ha-signals.yml"
      - ".github/workflows/test-finviz.yml"
      - ".github/workflows/test-tradingview-screener.yml"
      - ".github/workflows/import-vyus-holdings.yml"
      - ".github/workflows/vyus-holdings-csv.yml"
      - "data/dsr_ticker_sources.json"
      - "data/sw_financial_health.csv"
      - "tests/**"
      - "requirements-dsr.txt"
      - ".github/workflows/dsr-source-validation.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ha_signals.py"
      - "scripts/market_context.py"
      - "scripts/technical_score.py"
      - "scripts/long_fundamental_screen.py"
      - "scripts/sw_financial_health.py"
      - "scripts/dsr_schedule_guard.py"
      - "scripts/short_borrow.py"
      - "scripts/source_status.py"
      - "scripts/import_vyus_holdings.py"
      - "scripts/update_tradingview_screeners.py"
      - "data/dsr_ticker_sources.json"
      - "data/sw_financial_health.csv"
      - ".github/workflows/dsr-ha-signals.yml"
      - ".github/workflows/test-finviz.yml"
      - ".github/workflows/test-tradingview-screener.yml"
      - ".github/workflows/import-vyus-holdings.yml"
      - ".github/workflows/vyus-holdings-csv.yml"
      - "tests/**"
      - "requirements-dsr.txt"
      - ".github/workflows/dsr-source-validation.yml"

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dsr.txt
      - name: Install DSR dependencies
        run: pip install -r requirements-dsr.txt
      - name: Run source validation tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
