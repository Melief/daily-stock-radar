name: Import VYUS Top 25 Holdings

on:
  workflow_dispatch:
  schedule:
    - cron: "45 4 * * 1-5"

permissions:
  contents: read

jobs:
  import-vyus:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import VYUS holdings
        env:
          VYUS_GS_WEBAPP_URL: ${{ vars.VYUS_GS_WEBAPP_URL }}
          VYUS_GS_SECRET: ${{ secrets.VYUS_GS_SECRET }}
        run: python scripts/import_vyus_holdings.py
