name: Sync Finviz tickers to Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: "50 */2 * * *"

permissions:
  contents: read

jobs:
  sync-finviz:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Finviz tickers to Google Sheets
        env:
          GS_WEBAPP_URL: ${{ vars.GS_WEBAPP_URL }}
          GS_SECRET: ${{ secrets.GS_SECRET }}
        run: python scripts/sync_finviz_to_sheets.py
